[project]
name = "devscene-flow-host"
version = "0.1.0"
description = "The harness's GraphScene host."
requires-python = ">=3.11"
dependencies = [
    "graphscene",
]

[project.scripts]
devscene-flow-walker = "devscene_flow_host.commands.flow_walker:main"

[tool.uv.sources]
graphscene = { path = "../graphscene", editable = true }

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devscene_flow_host"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -rs"

[tool.importlinter]
root_package = "devscene_flow_host"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "devscene-flow-host-layers"
name = "Layers import downward only: commands over host over records"
type = "layers"
layers = [
    "devscene_flow_host.commands",
    "devscene_flow_host.host",
    "devscene_flow_host.records",
]

[[tool.importlinter.contracts]]
id = "devscene-flow-host-graphscene-outside-records"
name = "graphscene is never imported by records"
type = "forbidden"
source_modules = ["devscene_flow_host.records"]
forbidden_modules = ["graphscene"]
