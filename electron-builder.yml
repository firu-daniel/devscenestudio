appId: io.github.firu-daniel.devscenestudio
productName: DevScene Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - "!dist/**/*.map"
  # Browser mode (fixture-backed, for Playwright and the QA agent) never ships.
  - "!dist/browser/**"
  - package.json

mac:
  category: public.app-category.developer-tools
  # zip only for now: electron-builder 26 neither signs nor notarizes the DMG
  # container. Add a signed, notarized DMG before the first public release.
  target:
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # No `identity` here: it comes from CSC_NAME outside the repo, and
  # scripts/require-signing-env.mjs refuses a release build without it.
  notarize: true

linux:
  # AppImage and deb, for x64 (CI runner) and arm64 (the Lima VMs). Unsigned for now:
  # update integrity is the Day 3 test (detached-signature verify hook, flip condition 2).
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
  executableName: devscene-studio
  maintainer: Firu Daniel <firu-daniel@users.noreply.github.com>
  synopsis: Desktop app for DevScene runs
