# Type check, lint, unit/component tests and formatting on every PR (07 §4.1 step 11,
# `checks` job). The same `npm run check` / `vitest run` lines are the harness gate commands.
name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Both lines engines.node allows (^22.22.2 || ^24.15.0).
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Type check and lint
        run: npm run check
      - name: Unit and component tests
        run: npm test
      - name: Formatting
        run: npm run format
